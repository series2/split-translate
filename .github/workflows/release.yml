name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('manifest.json').read_text())['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match manifest version v{version}')
          PY

      - name: Build release ZIP
        run: python3 scripts/package.py

      - name: Verify release ZIP
        working-directory: dist
        run: |
          sha256sum --check *.zip.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          archive, = Path('.').glob('*.zip')
          with ZipFile(archive) as package:
              if package.testzip() is not None:
                  raise SystemExit('ZIP integrity check failed')
              json.loads(package.read('manifest.json'))
              for name in package.namelist():
                  if any(part.startswith('.') for part in Path(name).parts):
                      raise SystemExit(f'Unexpected hidden file: {name}')
          PY

      - name: Create GitHub Release with ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # create fails if the release already exists; never replace its assets.
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.zip.sha256 \
            --verify-tag \
            --title "Split Translate $GITHUB_REF_NAME" \
            --generate-notes
