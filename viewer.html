<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Split Translate</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <button id="toolbar-toggle" class="floating-control" type="button" aria-controls="toolbar" aria-expanded="false">設定</button>
    <button id="chat-toggle" class="floating-control" type="button" aria-controls="chat-pane" aria-expanded="false">AI</button>
    <header class="bar" id="toolbar" hidden>
      <div class="row">
        <a id="page-title" target="_blank" rel="noopener"></a>
      </div>
      <div class="row controls">
        <label>翻訳元
          <select id="sl"></select>
        </label>
        <label>翻訳先
          <select id="tl"></select>
        </label>
        <label>翻訳モデル
          <select id="profile"></select>
        </label>
        <label class="check"><input type="checkbox" id="sync" checked />スクロール同期</label>
        <button id="pause" type="button">一時停止</button>
        <button id="retry" type="button">再翻訳</button>
      </div>
      <div class="row">
        <span id="status" class="status" aria-live="polite"></span>
      </div>
      <div id="notice" class="notice" role="alert" hidden></div>
      <details id="translate-settings" class="settings">
        <summary>翻訳モデル設定を編集</summary>
        <label>名前 <input id="cfg-name" type="text" spellcheck="false" /></label>
        <label>プロバイダー
          <select id="cfg-provider">
            <option value="chrome">ブラウザー内蔵翻訳（Chrome / Edge、無料）</option>
            <option value="ollama">Ollama（ローカル）</option>
            <option value="openai">OpenAI互換API</option>
            <option value="anthropic">Anthropic</option>
            <option value="google">Google Cloud Translation</option>
            <option value="azure">Azure AI Translator</option>
          </select>
        </label>
        <label id="cfg-url-row">URL <input id="cfg-url" type="text" spellcheck="false" /></label>
        <label id="cfg-key-row">APIキー <input id="cfg-key" type="password" spellcheck="false" autocomplete="off" /></label>
        <label id="cfg-region-row">リージョン <input id="cfg-region" type="text" spellcheck="false" placeholder="例: japaneast（不明なら global）" /></label>
        <label id="cfg-model-row">モデル
          <input id="cfg-model" type="text" spellcheck="false" list="cfg-model-list" />
          <button id="cfg-refresh-models" type="button" title="Ollamaのインストール済みモデル一覧を取得">🔄</button>
        </label>
        <datalist id="cfg-model-list"></datalist>
        <label class="col" id="cfg-template-row">翻訳指示（テンプレート）
          <textarea id="cfg-template" rows="4" spellcheck="false"></textarea>
        </label>
        <p class="hint" id="cfg-hint"></p>
        <div class="settings-actions">
          <button id="cfg-update" type="button">更新</button>
          <button id="cfg-delete" type="button">削除</button>
          <button id="cfg-add" type="button">新規モデル設定として追加</button>
        </div>
      </details>
      <details id="chat-model-settings" class="settings">
        <summary>LLMチャットモデル設定を編集</summary>
        <label>設定
          <select id="chat-cfg-profile"></select>
        </label>
        <label>名前 <input id="chat-cfg-name" type="text" spellcheck="false" /></label>
        <label>プロバイダー
          <select id="chat-cfg-provider">
            <option value="chrome">Chrome内蔵 Local LLM</option>
            <option value="ollama">Ollama</option>
            <option value="openai">OpenAI互換API</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
        <label id="chat-cfg-url-row">URL <input id="chat-cfg-url" type="text" spellcheck="false" /></label>
        <label id="chat-cfg-key-row">APIキー <input id="chat-cfg-key" type="password" spellcheck="false" autocomplete="off" /></label>
        <label id="chat-cfg-model-row">モデル
          <input id="chat-cfg-model" type="text" spellcheck="false" list="chat-cfg-model-list" />
          <button id="chat-cfg-refresh-models" type="button" title="Ollamaのインストール済みモデル一覧を取得">🔄</button>
        </label>
        <datalist id="chat-cfg-model-list"></datalist>
        <p class="hint" id="chat-cfg-hint"></p>
        <div class="settings-actions">
          <button id="chat-cfg-update" type="button">更新</button>
          <button id="chat-cfg-delete" type="button">削除</button>
          <button id="chat-cfg-add" type="button">新規チャット設定として追加</button>
        </div>
      </details>
      <div id="progress" class="progress"><div></div></div>
    </header>

    <div id="empty" class="empty"></div>
    <!-- 元ページの複製。スクリプトは動かさず（sandbox）、CSS・画像はそのまま表示する。
         allow-same-origin: パネル側から DOM を書き換えるために必要 / allow-popups: リンクを新しいタブで開く -->
    <iframe id="frame" title="翻訳文" hidden
      sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

    <section id="chat-pane" aria-label="LLMチャット" hidden>
      <div id="chat-resizer" role="separator" aria-orientation="horizontal" aria-label="チャットの高さを変更" tabindex="0"></div>
      <header class="chat-header">
        <div class="chat-heading">
          <strong>LLMチャット</strong>
          <select id="chat-profile" aria-label="チャットモデル設定"></select>
          <span id="chat-domain"></span>
        </div>
        <div class="chat-actions">
          <button id="chat-settings" type="button">モデル設定</button>
          <button id="chat-reset" type="button">会話をリセット</button>
          <button id="chat-close" type="button" aria-label="チャットを閉じる">×</button>
        </div>
      </header>
      <div id="chat-messages" role="log" aria-live="polite"></div>
      <div id="chat-status" aria-live="polite"></div>
      <form id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="このページの分からない箇所を質問…" required></textarea>
        <button id="chat-send" type="submit">送信</button>
      </form>
    </section>

    <script src="translate.js"></script>
    <script src="compose.js"></script>
    <script src="scrollsync.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
